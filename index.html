<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="index, follow">
  <meta name="description" content="VIPpl. Opportunity is everywhere.">
  <title>VIPpl — Opportunity Is Everywhere</title>
  <style>
    :root{color-scheme:dark;--bg:#080808;--fg:#f6f6f4;--yellow:#f5cc26;--muted:#777}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    .shell{min-height:100svh;display:grid;grid-template-rows:1fr auto;padding:clamp(24px,5vw,72px)}
    main{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:70px 0 35px}
    .brand{font-size:clamp(76px,15vw,154px);font-weight:850;letter-spacing:-.09em;line-height:1;white-space:nowrap;padding-right:.09em;user-select:none}
    .brand .accent{color:var(--yellow)}
    .line{width:38px;height:1px;background:var(--yellow);margin:43px auto 32px;opacity:.85}
    h1{font-size:clamp(12px,1.3vw,15px);font-weight:600;letter-spacing:.34em;line-height:1.8;text-transform:uppercase;margin:0;padding-left:.34em}
    footer{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.12em;line-height:1.8}
    @media(max-width:480px){.shell{padding:26px 18px}main{padding-bottom:60px}.line{margin:34px auto 26px}h1{letter-spacing:.22em;padding-left:.22em}footer{font-size:10px}}
    @media(prefers-reduced-motion:no-preference){main{animation:appear 1s ease-out both}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
  <div class="shell">
    <main aria-label="VIPpl">
      <div class="brand" aria-label="VIPpl">VIP<span class="accent">pl</span></div>
      <div class="line" aria-hidden="true"></div>
      <h1>OPPORTUNITY IS EVERYWHERE.</h1>
    </main>
    <footer>© <span id="year">2026</span> VIPpl. All rights reserved.</footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
